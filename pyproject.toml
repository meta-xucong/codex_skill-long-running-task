[project]
name = "longrun-supervisor"
version = "0.1.0"
description = "CLI supervisor for state-driven long-running Codex tasks."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
longrun-supervisor = "longrun_supervisor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
